<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        
        <header class="card header-card">
            <div class="top-bar">
                <button id="theme-toggle-btn">🌙 Dark Mode</button>
            </div>
            <div id="clock">10:45:22</div>
            <div id="date">Tuesday, January 27, 2026</div>
            
            <!-- Tantangan 2: Custom Name in Greeting -->
            <div class="greeting-container">
                <span id="greeting">Good Morning</span>
                <span id="user-name-display"></span>
                <button id="edit-name-btn" title="Edit Name">✏️</button>
            </div>
            <div id="name-input-container" class="hidden">
                <input type="text" id="name-input" placeholder="Enter your name...">
                <button id="save-name-btn">Save</button>
            </div>
        </header>

        <div class="grid-container">
            <section class="card timer-card">
                <h2>Focus Timer</h2>
                <div id="timer-display">25:00</div>
                <div class="timer-controls">
                    <button id="start-btn">Start</button>
                    <button id="stop-btn">Stop</button>
                    <button id="reset-btn">Reset</button>
                </div>
                <!-- Tantangan 3: Change Pomodoro Time -->
                <div class="timer-settings">
                    <label for="timer-duration">Duration (mins):</label>
                    <input type="number" id="timer-duration" value="25" min="1" max="120">
                    <button id="set-duration-btn">Set</button>
                </div>
            </section>

            <section class="card todo-card">
                <h2>Tasks</h2>
                <div class="todo-input-group">
                    <input type="text" id="task-input" placeholder="Add a new task...">
                    <button id="add-task-btn">Add</button>
                </div>
                <ul id="task-list"></ul>
            </section>
        </div>
        
        <section class="card links-card">
            <h2>Quick Links</h2>
            <div class="link-input-group">
                <input type="text" id="link-name" placeholder="Link name">
                <input type="url" id="link-url" placeholder="URL">
                <button id="add-link-btn">Add Link</button>
            </div>
            <div id="links-container">
                <!-- Dynamic quick links -->
            </div>
        </section>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
